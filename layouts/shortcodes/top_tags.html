{{- $limit := int (or (.Get "limit") "14") -}}
{{- $tags := first $limit (site.Taxonomies.tags.ByCount) -}}

<div class="dt-tagcloud">
  {{- range $tags }}
  <a class="dt-tag" href="{{ .Page.RelPermalink }}">
    <span class="dt-tag-name">{{ .Page.Title }}</span>
    <span class="dt-tag-count">{{ .Count }}</span>
  </a>
  {{- end }}
</div>

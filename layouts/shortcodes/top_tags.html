{{- $limit := int (or (.Get "limit") "14") -}}
{{- $tags := .Site.Taxonomies.tags.ByCount -}}

<section class="clova-tag-cloud">
  {{- range first $limit $tags }}
  <a class="clova-tag-item" href="{{ .Page.RelPermalink }}">
    <span class="clova-tag-name">#{{ .Page.Title }}</span>
    <span class="clova-tag-count">{{ .Count }}</span>
  </a>
  {{- end }}
</section>

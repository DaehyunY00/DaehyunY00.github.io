{{ define "main" }}
  <article class="article">
    <header class="article-head">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}
        <p class="article-description">{{ . }}</p>
      {{ end }}
    </header>
    <div class="article-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
